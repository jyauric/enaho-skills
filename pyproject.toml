[project]
name = "enaho-skills"
version = "0.1.0"
description = "Skills de Claude Code para limpiar, graficar y mapear la ENAHO 2024"
readme = "README.md"
authors = [
    { name = "jyauric", email = "jyauric@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
]

[project.scripts]
enaho-skills = "enaho_skills:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
